<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Hồ sơ của tôi')}"></head>
<body><nav th:replace="~{fragments/layout :: nav}"></nav><main class="container py-4">
<h1 class="h3 mb-4">Hồ sơ của tôi</h1><div th:replace="~{fragments/layout :: messages}"></div>
<div class="card p-4"><p>Họ tên: <span th:text="${user.fullName}"></span></p><p>Email: <span th:text="${user.email}"></span></p><p>Số điện thoại: <span th:text="${user.phone}"></span></p><p>Mã thẻ: <span th:text="${reader.readerCode}"></span></p><p>Ngày tham gia: <span th:text="${reader.memberSince}"></span></p><p>Hạn thẻ: <span th:text="${reader.memberExpiry}"></span></p><p>Giới hạn mượn: <span th:text="${reader.maxBorrowAllowed}"></span></p></div></main></body></html>
