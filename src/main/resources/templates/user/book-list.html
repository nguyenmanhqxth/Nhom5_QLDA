<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Kho sách')}"></head>
<body><nav th:replace="~{fragments/layout :: nav}"></nav><main class="container py-4">
<h1 class="h3 mb-4">Kho sách</h1><div th:replace="~{fragments/layout :: messages}"></div>

<form th:action="@{/books/list}" method="get" class="card p-3 mb-4"><div class="row g-2">
<div class="col-md-4"><input aria-label="Tìm sách" name="search" th:value="${search}" class="form-control" placeholder="Tên sách hoặc tác giả"></div>
<div class="col-md-3"><select aria-label="Thể loại" name="categoryId" class="form-select"><option value="">Tất cả thể loại</option><option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}" th:selected="${c.id == selectedCategory}"></option></select></div>
<div class="col-md-2"><select aria-label="Sắp xếp" name="sort" class="form-select"><option value="newest">Mới nhất</option><option value="oldest" th:selected="${sort == 'oldest'}">Cũ nhất</option><option value="az" th:selected="${sort == 'az'}">A–Z</option><option value="za" th:selected="${sort == 'za'}">Z–A</option></select></div>
<div class="col-md-3"><label class="m-0"><input type="checkbox" name="availableOnly" value="true" th:checked="${availableOnly}"> Còn sách</label> <button class="btn btn-primary">Tìm</button></div></div></form>
<div class="row g-3"><div th:each="book : ${books}" class="col-sm-6 col-lg-4"><div class="card p-4 book">
<span class="text-muted small" th:text="${book.category != null ? book.category.name : 'Chưa phân loại'}"></span>
<h2 class="h5 mt-2" th:text="${book.title}"></h2><p th:text="${book.author}"></p>
<p th:text="${book.availableCopies > 0 ? 'Còn ' + book.availableCopies + ' bản' : 'Hết sách'}"></p>
<a th:href="@{/books/detail/{id}(id=${book.id})}" class="btn btn-outline-primary mt-auto">Xem chi tiết</a></div></div></div>
<p th:if="${#lists.isEmpty(books)}" class="alert alert-info">Không tìm thấy sách.</p></main></body></html>
