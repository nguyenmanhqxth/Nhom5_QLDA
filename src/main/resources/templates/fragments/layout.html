<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title th:text="${title} + ' | Thư viện Nhóm 5'"></title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
<style>body{background:#f4f6fa;color:#243047}nav{background:#172a46}nav a{color:#fff;text-decoration:none}main{max-width:1200px}.card{border:0;box-shadow:0 2px 10px #172a4610}td,th{vertical-align:middle}label{font-weight:600;margin-top:.7rem}.book{height:100%}</style></head>
<body><nav th:fragment="nav" class="p-3"><div class="container d-flex gap-3 flex-wrap align-items-center">
<a class="fw-bold" th:href="@{/}">Thư viện Nhóm 5</a><a th:href="@{/books/list}">Kho sách</a>
<th:block sec:authorize="hasRole('ADMIN')"><a th:href="@{/admin/dashboard}">Quản trị</a><a th:href="@{/admin/books}">Sách</a><a th:href="@{/admin/categories}">Thể loại</a><a th:href="@{/admin/readers}">Độc giả</a><a th:href="@{/admin/borrows}">Phiếu mượn</a></th:block>
<th:block sec:authorize="hasRole('USER')"><a th:href="@{/user/home}">Trang chủ</a><a th:href="@{/user/my-borrows}">Phiếu của tôi</a><a th:href="@{/user/profile}">Hồ sơ</a></th:block>
<th:block sec:authorize="isAnonymous()"><a th:href="@{/auth/login}">Đăng nhập</a><a th:href="@{/auth/register}">Đăng ký</a></th:block>
<form sec:authorize="isAuthenticated()" th:action="@{/auth/logout}" method="post" class="ms-auto"><button class="btn btn-outline-light btn-sm">Đăng xuất</button></form>
</div></nav><div th:fragment="messages"><div th:if="${success}" class="alert alert-success" th:text="${success}"></div><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div></div></body></html>
