<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Thông tin sách')}"></head>
<body><nav th:replace="~{fragments/layout :: nav}"></nav><main class="container py-4">
<h1 class="h3 mb-4">Thông tin sách</h1><div th:replace="~{fragments/layout :: messages}"></div>
<form th:action="@{/admin/books/save}" method="post" th:object="${book}" class="card p-4"><input type="hidden" th:field="*{id}"><div class="row"><label class="col-md-6">Tên sách<input class="form-control" type="text" th:field="*{title}" required></label><label class="col-md-6">Tác giả<input class="form-control" type="text" th:field="*{author}"></label><label class="col-md-6">Nhà xuất bản<input class="form-control" type="text" th:field="*{publisher}"></label><label class="col-md-6">ISBN / Mã sách<input class="form-control" type="text" th:field="*{isbn}"></label><label class="col-md-6">Ngày xuất bản<input class="form-control" type="date" th:field="*{publishDate}"></label><label class="col-md-6">Tổng số bản<input class="form-control" type="number" th:field="*{totalCopies}" required min="0"></label><label class="col-md-6">Số bản còn<input class="form-control" type="number" th:field="*{availableCopies}" required min="0"></label><label class="col-md-6">Giá sách<input class="form-control" type="number" th:field="*{price}" required min="0" step="0.01"></label><label class="col-md-6">Đường dẫn ảnh bìa<input class="form-control" type="text" th:field="*{coverImage}"></label><label class="col-md-6">Thể loại<select class="form-select" name="categoryId"><option value="">Chưa phân loại</option><option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}" th:selected="${book.category != null and book.category.id == c.id}"></option></select></label></div><label>Mô tả<textarea class="form-control" th:field="*{description}" maxlength="255"></textarea></label><button class="btn btn-primary mt-3">Lưu sách</button></form></main></body></html>
