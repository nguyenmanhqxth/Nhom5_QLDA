<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Xử lý phiếu mượn')}"></head>
<body><nav th:replace="~{fragments/layout :: nav}"></nav><main class="container py-4">
<h1 class="h3 mb-4">Xử lý phiếu mượn</h1><div th:replace="~{fragments/layout :: messages}"></div>

<form method="get" class="d-flex gap-2 mb-3"><select name="status" class="form-select"><option value="">Tất cả trạng thái</option><option>PENDING</option><option>CONFIRMED</option><option>BORROWED</option><option>REJECTED</option></select><button class="btn btn-primary">Lọc</button></form>
<div class="table-responsive card"><table class="table"><thead><tr><th>Mã phiếu</th><th>Độc giả</th><th>Sách</th><th>Phí</th><th>Trạng thái / Ghi chú</th><th>Người giao / Thời gian</th><th>Thao tác</th></tr></thead><tbody><tr th:each="b : ${borrows}">
<td th:text="${b.receiptCode != null ? b.receiptCode : '#' + b.id}"></td><td th:text="${b.reader.user.fullName}"></td><td th:text="${b.book.title}"></td><td th:text="${b.borrowFee}"></td><td><span th:text="${b.status}"></span><p th:text="${b.notes}"></p></td><td><span th:text="${b.staff != null ? b.staff.username : '—'}"></span><br><small th:text="${b.paymentConfirmedAt}"></small></td>
<td><div th:if="${b.status.name() == 'PENDING'}"><form th:action="@{/admin/borrows/approve/{id}(id=${b.id})}" method="post"><button class="btn btn-success btn-sm">Duyệt</button></form><form th:action="@{/admin/borrows/reject/{id}(id=${b.id})}" method="post" class="mt-2"><input name="reason" required maxlength="255" class="form-control form-control-sm" placeholder="Lý do từ chối"><button class="btn btn-danger btn-sm mt-1">Từ chối</button></form></div>
<form th:if="${b.status.name() == 'CONFIRMED'}" th:action="@{/admin/borrows/confirm-payment/{id}(id=${b.id})}" method="post"><button class="btn btn-success btn-sm" onclick="return confirm('Đã nhận đủ phí và bàn giao sách?')">Nhận phí và giao sách</button></form>
<a th:if="${b.receiptCode != null}" th:href="@{/admin/borrows/receipt/{id}(id=${b.id})}" class="btn btn-outline-primary btn-sm mt-2">Xem phiếu</a></td></tr></tbody></table></div>
</main></body></html>
